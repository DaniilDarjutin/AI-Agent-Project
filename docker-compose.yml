services:
  backend:
    profiles:
      - fullstack
    build:
      context: ./backend
    container_name: ai-agent-backend
    env_file:
      - ./backend/.env
    environment:
      database_url: sqlite:////app/database/app.db
    volumes:
      - ./database:/app/database
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: ai-agent-frontend
    ports:
      - "5173:5173"
